name: CI Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
          
      - name: Run Pytest
        run: |
          pytest tests/
