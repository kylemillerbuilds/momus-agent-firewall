name: "Momus Agent Firewall"
description: "Two tiers for AI-written pull requests: four rules that read the code, seven that read the agent's own description of it."
inputs:
  path:
    description: "The path to scan with the code tier (file or directory)"
    required: false
    default: "."
  allowlist:
    description: "Path to a JSON array of allowed strings (e.g. valid wallets)"
    required: false
  report:
    description: "Path to the agent's report (write the PR body to a file, see README). Enables the claim tier."
    required: false
  diff:
    description: "Path to a unified diff of the change. Enables control-removed and scopes the checker rules."
    required: false
  run_tests:
    description: "Let Momus run pytest and compare the run to what the report claims ('true' / 'false')"
    required: false
    default: "false"
  blind_is_fail:
    description: "Fail the job when a claim rule could not look ('true' / 'false')"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Momus, code tier
      shell: bash
      run: |
        ALLOWLIST_ARG=""
        if [ -n "${{ inputs.allowlist }}" ]; then
          ALLOWLIST_ARG="--allowlist ${{ inputs.allowlist }}"
        fi
        PYTHONPATH=${GITHUB_ACTION_PATH} python3 -m momus_firewall.cli "${{ inputs.path }}" $ALLOWLIST_ARG
    - name: Momus, claim tier
      if: ${{ inputs.report != '' }}
      shell: bash
      run: |
        ARGS=""
        if [ -n "${{ inputs.diff }}" ]; then ARGS="$ARGS --diff ${{ inputs.diff }}"; fi
        if [ "${{ inputs.run_tests }}" = "true" ]; then ARGS="$ARGS --run-tests"; fi
        if [ "${{ inputs.blind_is_fail }}" = "true" ]; then ARGS="$ARGS --blind-is-fail"; fi
        if [ -n "${{ inputs.allowlist }}" ]; then ARGS="$ARGS --allowlist ${{ inputs.allowlist }}"; fi
        PYTHONPATH=${GITHUB_ACTION_PATH} python3 -m momus_firewall.cli claims "${{ inputs.report }}" --tree "${{ inputs.path }}" $ARGS
